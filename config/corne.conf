# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# ZMK Studio is enabled for the central (left) side via build.yaml:
#   snippet: studio-rpc-usb-uart
#   cmake-args: -DCONFIG_ZMK_STUDIO=y
# Locking is on by default; these only take effect when STUDIO is enabled,
# so they are safe to keep here for both sides.
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=300
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
